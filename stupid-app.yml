version: 1
product: StupidWallet
bundleID: co.za.stephancill.stupid-wallet
deploymentTarget: "17.0"
infoPath: Info.plist
entitlementsPath: App.entitlements
iconPath: Resources/AppIcon.png
resources:
  - Resources/AppIcon.png
capabilities:
  - entitlementKey: aps-environment
    type: PUSH_NOTIFICATIONS
  - entitlementKey: com.apple.security.application-groups
    type: APP_GROUPS
  - entitlementKey: com.apple.developer.siri
    type: SIRIKIT
extensions:
  - product: StupidWalletSafari
    bundleID: co.za.stephancill.stupid-wallet.extension
    infoPath: SafariExtension/Info.plist
    entitlementsPath: SafariExtension/SafariExtension.entitlements
    capabilities:
      - entitlementKey: com.apple.security.application-groups
        type: APP_GROUPS
    resources:
      - SafariExtension/Resources/manifest.json
      - SafariExtension/Resources/provider.js
      - SafariExtension/Resources/bridge.js
      - SafariExtension/Resources/background.js
      - SafariExtension/Resources/popup.html
      - SafariExtension/Resources/popup.css
      - SafariExtension/Resources/popup.js
      - SafariExtension/Resources/icon-48.png
      - SafariExtension/Resources/icon-128.png
      - SafariExtension/Resources/toolbar-icon-16.png
      - SafariExtension/Resources/toolbar-icon-19.png
      - SafariExtension/Resources/toolbar-icon-32.png
      - SafariExtension/Resources/toolbar-icon-38.png
  - product: StupidWalletNotificationService
    bundleID: co.za.stephancill.stupid-wallet.notification-service
    infoPath: NotificationServiceExtension/Info.plist
    entitlementsPath: NotificationServiceExtension/NotificationService.entitlements
    capabilities:
      - entitlementKey: com.apple.security.application-groups
        type: APP_GROUPS
