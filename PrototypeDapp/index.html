<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stupid Wallet · Test Dapp</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
        h1 { font-size: 22px; }
        pre { background: rgba(0,0,0,0.06); padding: 12px; border-radius: 8px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
        button { padding: 10px 16px; border-radius: 10px; border: 0; background: #4c6ef5; color: #fff; font-size: 15px; cursor: pointer; margin: 6px 6px 0 0; }
        button:last-child { margin-right: 0; }
        .status { margin-top: 12px; }
        .ev { margin: 6px 0; padding: 8px; background: #fff7ed; border-radius: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <h1>Test Dapp</h1>
    <p id="connectState">Not connected.</p>
    <p id="utfState">No provider injected yet.</p>

    <h3>Approval kinds</h3>
    <button id="connect">① Connect wallet</button>
    <button id="sign">② Personal sign</button>
    <button id="typed">Typed-data (EIP-712)</button>
    <button id="send">Send transaction</button>
    <button id="addChain">Add network</button>
    <button id="switchChain">Switch network</button>
    <button id="denied">Denied: eth_sign</button>

    <h3>Read-only passthrough</h3>
    <button id="chain">eth_chainId</button>
    <button id="block">eth_blockNumber</button>
    <button id="gas">eth_gasPrice</button>
    <button id="balance">eth_getBalance</button>
    <button id="txcount">eth_getTransactionCount</button>
    <button id="blockByNum">eth_getBlockByNumber</button>
    <button id="client">web3_clientVersion</button>
    <button id="sweep">Sweep all RPCs</button>
    <button id="clear">Clear log</button>

    <h3>Result</h3>
    <pre id="result">—</pre>

    <h3>EIP-6963 providers</h3>
    <div class="ev" id="eip6963">Looking…</div>

    <h3>Log</h3>
    <pre id="log">—</pre>

    <script>
        async function logLine(label, value) {
            const log = document.getElementById("log");
            log.textContent = log.textContent === "—" ? "" : log.textContent;
            log.textContent += `[${label}] ${value}\n`;
        }

        function show(result) {
            document.getElementById("result").textContent =
                typeof result === "string" ? result : JSON.stringify(result, null, 2);
            logLine((window.ethereum ? "provider" : "none"), "done");
        }

        function errorShow(err) {
            document.getElementById("result").textContent =
                "Error: " + (err && err.message ? err.message : String(err));
            logLine("error", (err && (err.message || JSON.stringify(err))) || String(err));
        }

        window.addEventListener("eip6963:announceProvider", (e) => {
            const ev = document.getElementById("eip6963");
            const info = e.detail && e.detail.info ? e.detail.info : {};
            ev.textContent = `${info.name || "unknown"} · ${info.rdns || "?"} · isStupidWallet=${!!(e.detail && e.detail.provider && e.detail.provider.isStupidWallet)}`;
            logLine("eip6963", `${info.name || "unknown"} · ${info.rdns || "?"}`);
        });

        document.getElementById("connect").addEventListener("click", async () => {
            try {
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                show(accounts);
                document.getElementById("utfState").textContent = "Connected: " + accounts.join(", ");
            } catch (e) { errorShow(e); }
        });
        document.getElementById("chain").addEventListener("click", async () => {
            try { show(await window.ethereum.request({ method: "eth_chainId" })); }
            catch (e) { errorShow(e); }
        });
        document.getElementById("typed").addEventListener("click", async () => {
            try {
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                const address = accounts && accounts[0];
                const sig = await window.ethereum.request({
                    method: "eth_signTypedData_v4",
                    params: [address, JSON.stringify({
                        types: {
                            EIP712Domain: [
                                { name: "name", type: "string" },
                                { name: "version", type: "string" },
                                { name: "chainId", type: "uint256" },
                                { name: "verifyingContract", type: "address" },
                            ],
                            Mail: [
                                { name: "from", type: "Person" },
                                { name: "to", type: "Person" },
                                { name: "contents", type: "string" },
                            ],
                            Person: [
                                { name: "name", type: "string" },
                                { name: "wallet", type: "address" },
                            ],
                        },
                        primaryType: "Mail",
                        domain: {
                            name: "Stupid Wallet Test",
                            version: "1",
                            chainId: 1,
                            verifyingContract: "0xCcCCccccCCCCcCCCCCCcCcCccCcCCCcCcccccccC",
                        },
                        message: {
                            from: { name: "Cow", wallet: address },
                            to: { name: "Bob", wallet: "0xbBbBBBBbbBBBbbbBbbBbbbbBBbBbbbbBbBbbBBbB" },
                            contents: "Hello, Bob!",
                        },
                    })],
                });
                show(sig);
                logLine("eth_signTypedData_v4", sig ? sig.slice(0, 20) + "…" : sig);
            } catch (e) { errorShow(e); }
        });
        document.getElementById("send").addEventListener("click", async () => {
            try {
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                const result = await window.ethereum.request({
                    method: "eth_sendTransaction",
                    params: [{
                        from: accounts[0],
                        to: "0x0000000000000000000000000000000000000001",
                        value: "0x0",
                        data: "0x",
                    }],
                });
                show(result);
                logLine("eth_sendTransaction", String(result).slice(0, 20) + "…");
            } catch (e) { errorShow(e); }
        });
        document.getElementById("addChain").addEventListener("click", async () => {
            try {
                const result = await window.ethereum.request({
                    method: "wallet_addEthereumChain",
                    params: [{
                        chainId: "0x89",
                        chainName: "Polygon",
                        nativeCurrency: { name: "MATIC", symbol: "MATIC", decimals: 18 },
                        rpcUrls: ["https://evm.stupidtech.net/v1/137"],
                    }],
                });
                logLine("wallet_addEthereumChain", "sent");
            } catch (e) { errorShow(e); }
        });
        document.getElementById("switchChain").addEventListener("click", async () => {
            try {
                const result = await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: "0x1" }],
                });
                logLine("wallet_switchEthereumChain", "sent");
            } catch (e) { errorShow(e); }
        });
        if (document.getElementById("denied")) {
            document.getElementById("denied").addEventListener("click", async () => {
                try {
                    await window.ethereum.request({ method: "eth_sign", params: ["0x", "0x00"] });
                    logLine("eth_sign", "should NOT have resolved");
                } catch (e) {
                    logLine("eth_sign denied", `${e && e.code} · ${e && e.message}`);
                    document.getElementById("result").textContent =
                        "Denied: " + (e && e.code) + " " + (e && e.message);
                }
            });
        }
        document.getElementById("sign").addEventListener("click", async () => {
            try {
                const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
                const address = accounts && accounts[0];
                const sig = await window.ethereum.request({
                    method: "personal_sign",
                    params: [
                        "0x" + toHex("Welcome to Stupid Wallet dapp!\n\nSign in securely.\n\nChain: Ethereum"),
                        address,
                    ],
                });
                show(sig);
                logLine("personal_sign", sig ? sig.slice(0, 20) + "…" : sig);
            } catch (e) { errorShow(e); }
        });
        document.getElementById("clear").addEventListener("click", () => {
            document.getElementById("log").textContent = "—";
            document.getElementById("result").textContent = "—";
        });

        async function rpc(method, params) {
            try {
                const value = await window.ethereum.request({ method, params });
                show(value);
                logLine(method, typeof value === "string" ? value.slice(0, 26) + "…" : JSON.stringify(value));
            } catch (e) { errorShow(e); }
        }

        document.getElementById("block").addEventListener("click", () => rpc("eth_blockNumber"));
        document.getElementById("gas").addEventListener("click", () => rpc("eth_gasPrice"));
        document.getElementById("balance").addEventListener("click", () => rpc("eth_getBalance", ["0xD8d6F226E874eE8257Ac2600f4C2B0A0A8d9c1d0", "latest"]));
        document.getElementById("txcount").addEventListener("click", () => rpc("eth_getTransactionCount", ["0xD8d6F226E874eE8257Ac2600f4C2B0A0A8d9c1d0", "latest"]));
        document.getElementById("blockByNum").addEventListener("click", () => rpc("eth_getBlockByNumber", ["latest", false]));
        document.getElementById("client").addEventListener("click", () => rpc("web3_clientVersion"));

        const ACCOUNT = "0xD8d6F226E874eE8257Ac2600f4C2B0A0A8d9c1d0";
        const SWEEP = [
            ["eth_chainId", []],
            ["net_version", []],
            ["eth_blockNumber", []],
            ["eth_gasPrice", []],
            ["eth_getBalance", [ACCOUNT, "latest"]],
            ["eth_getTransactionCount", [ACCOUNT, "latest"]],
            ["eth_getBlockByNumber", ["latest", false]],
            ["eth_getCode", [ACCOUNT, "latest"]],
            ["eth_call", [{ to: "0x0000000000000000000000000000000000000000", data: "0x" }, "latest"]],
            ["web3_clientVersion", []],
        ];

        document.getElementById("sweep").addEventListener("click", async () => {
            const out = {};
            for (const [method, params] of SWEEP) {
                try {
                    const value = await window.ethereum.request({ method, params });
                    out[method] = typeof value === "string" ? value : value;
                } catch (e) {
                    out[method] = "ERR: " + (e && e.message ? e.message : String(e));
                }
            }
            document.getElementById("result").textContent = JSON.stringify(out, null, 2);
            logLine("sweep", Object.keys(out).length + " calls completed");
        });

        function toHex(str) {
            let hex = "";
            for (let i = 0; i < str.length; i++) {
                hex += str.charCodeAt(i).toString(16).padStart(2, "0");
            }
            return hex;
        }

        // Wait for provider to appear (injected at document_idle).
        let waitedFor = 0;
        const loop = setInterval(() => {
            if (typeof window.ethereum !== "undefined") {
                clearInterval(loop);
                document.getElementById("utfState").textContent = "Provider detected: eth_requestAccounts ready."
                logLine("provider", "injected");
            } else if (waitedFor++ > 30) {
                clearInterval(loop);
                document.getElementById("utfState").textContent = "No provider injected yet.";
            }
        }, 500);
    </script>
</body>
</html>
