name: StupidWalletMac
options:
  bundleIdPrefix: co.za.stephancill
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_ENABLE_MODULES: YES
targets:
  StupidWalletCore:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/StupidWalletCore
      - path: ../Sources/CSecp256k1
        excludes:
          - include
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_NAME: StupidWalletCore
        PRODUCT_MODULE_NAME: StupidWalletCore
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/CSecp256k1Module
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../Sources/CSecp256k1/include
        GCC_PREPROCESSOR_DEFINITIONS:
          - ENABLE_MODULE_RECOVERY=1
          - ENABLE_MODULE_ECDH=1
  StupidWalletSafariExt:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Sources/StupidWalletSafari
    postCompileScripts:
      - name: Copy Safari Extension Resources
        basedOnDependencyAnalysis: false
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          rsync -a --exclude='.DS_Store' "$SRCROOT/../SafariExtension/Resources/" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/"
    dependencies:
      - target: StupidWalletCore
    info:
      path: Info-Ext.plist
      properties:
        CFBundleDisplayName: "stupid wallet"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: StupidWalletSafari.SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.za.stephancill.stupid-wallet.extension
        PRODUCT_NAME: StupidWalletSafari
        PRODUCT_MODULE_NAME: StupidWalletSafari
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info-Ext.plist
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/CSecp256k1Module
        CODE_SIGN_ENTITLEMENTS: SafariExtension.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 6JKMV57Y77
        CODE_SIGN_IDENTITY: "Apple Development: Created via API (P6ZUM5V6TP)"
        PROVISIONING_PROFILE_SPECIFIER: "StupidWallet-Mac-NativeMessaging co.za.stephancill.stupid-wallet.extension Development"
  StupidWalletApp:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/StupidWallet
    dependencies:
      - target: StupidWalletCore
      - target: StupidWalletSafariExt
        embed: true
    info:
      path: Info-App.plist
      properties:
        CFBundleDisplayName: "stupid wallet"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.za.stephancill.stupid-wallet
        PRODUCT_NAME: StupidWallet
        PRODUCT_MODULE_NAME: StupidWallet
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info-App.plist
        SWIFT_INCLUDE_PATHS:
          - $(SRCROOT)/CSecp256k1Module
        CODE_SIGN_ENTITLEMENTS: App.entitlements
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 6JKMV57Y77
        CODE_SIGN_IDENTITY: "Apple Development: Created via API (P6ZUM5V6TP)"
        PROVISIONING_PROFILE_SPECIFIER: "StupidWallet-Mac-NativeMessaging co.za.stephancill.stupid-wallet Development"
schemes:
  StupidWallet:
    build:
      targets:
        StupidWalletApp: all
        StupidWalletSafariExt: all
    run:
      config: Debug